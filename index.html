<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Projeto Eclipse</title>

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        :root {
            --bg-1: #090909; --bg-2: #151515;
            --panel: #171717; --panel-2: #1d1d1d;
            --border: rgba(255,255,255,.10);
            --text: #f4f4f4; --muted: rgba(255,255,255,.68);
            --accent: #d5d5d5; --danger: #ffaaaa;
        }

        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            color: var(--text);
            background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
            overflow: hidden;
            display: flex; flex-direction: column;
        }

        #tela-inicio {
            position: fixed; inset: 0; z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            background: rgba(5,5,5,0.95);
        }
        .painel-inicio {
            width: 90%; max-width: 550px;
            padding: 30px; text-align: center;
            background: #111; border: 1px solid var(--border);
            border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.9);
        }
        #capa-jogo {
            width: 100%; max-height: 220px; object-fit: cover;
            border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--border);
        }
        #titulo-abertura { margin: 5px 0; font-size: 2rem; letter-spacing: 2px; }
        #subtitulo-abertura { color: var(--muted); margin-bottom: 20px; font-size: 0.95rem; }
        #botao-iniciar {
            width: 100%; padding: 14px; font-size: 1.1rem; font-weight: bold;
            background: #fff; color: #000; border: none; border-radius: 8px;
            cursor: pointer; transition: 0.2s;
        }
        #botao-iniciar:hover:not(:disabled) { transform: scale(1.02); }
        #botao-iniciar:disabled { opacity: 0.5; cursor: wait; }

        /* GRID CORRIGIDO COM ALTURA FLEXÍVEL */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: auto 1fr;
            grid-template-areas: "cabecalho cabecalho" "midia painel";
            gap: 15px; max-width: 1400px; width: 100%; height: 100%;
            margin: 0 auto; padding: 15px; overflow: hidden;
        }
        
        .cabecalho { grid-area: cabecalho; text-align: center; }
        #titulo-jogo { margin: 0; font-size: 1.5rem; letter-spacing: 1px; }
        #autor-jogo { margin: 2px 0 0; color: var(--muted); font-size: 0.8rem; }

        .midia {
            grid-area: midia; display: flex; flex-direction: column;
            background: var(--panel-2); padding: 10px;
            border: 1px solid var(--border); border-radius: 16px; min-height: 0;
        }
        .media-frame {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: #000; border-radius: 12px; overflow: hidden; min-height: 0;
        }
        #imagem-cena, #video-cena {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        
        #btn-mutar {
            width: 100%; margin-top: 8px; padding: 8px;
            background: #2a2a2a; color: #fff; border: 1px solid var(--border);
            border-radius: 8px; cursor: pointer; font-size: 0.85rem;
            flex-shrink: 0;
        }
        #btn-mutar:hover { background: #3a3a3a; }

        /* PAINEL DIREITO COM ROLAGEM INTERNA E BOTÕES FIXOS NA BASE */
        .painel-jogo {
            grid-area: painel; display: flex; flex-direction: column; gap: 10px;
            background: var(--panel); padding: 15px;
            border: 1px solid var(--border); border-radius: 16px; min-height: 0; overflow: hidden;
        }
        #titulo-cena { margin: 0; font-size: 1.3rem; color: var(--accent); flex-shrink: 0; }
        
        #texto-cena {
            flex: 1; overflow-y: auto; white-space: pre-line;
            padding: 12px; background: rgba(255,255,255,.03);
            border-left: 4px solid var(--muted); border-radius: 8px;
            font-size: 0.95rem; line-height: 1.5; min-height: 60px;
        }

        #status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; flex-shrink: 0; }
        .status-box {
            padding: 6px; background: rgba(255,255,255,.03);
            border: 1px solid var(--border); border-radius: 8px; text-align: center;
        }
        .status-label { display: block; font-size: 0.6rem; color: var(--muted); text-transform: uppercase; margin-bottom: 2px; }
        .status-value { font-size: 0.95rem; font-weight: bold; }
        #vida.danger { color: var(--danger); }

        #inventario-box { cursor: pointer; transition: background 0.2s; }
        #inventario-box:hover { background: rgba(255,255,255,0.08); }
        
        #modal-inventario {
            display: none; position: fixed; inset: 0; z-index: 99999;
            background: rgba(0,0,0,0.7); align-items: center; justify-content: center;
        }
        .modal-conteudo {
            background: #1a1a1a; border: 1px solid var(--border); padding: 20px;
            border-radius: 12px; width: 320px; text-align: center;
        }
        .modal-conteudo h3 { margin-top: 0; color: var(--accent); }
        #lista-itens { list-style: none; padding: 0; margin: 10px 0; text-align: left; max-height: 150px; overflow-y: auto; }
        #lista-itens li { padding: 6px; border-bottom: 1px solid rgba(255,255,255,0.1); font-size: 0.9rem; }
        #fechar-inventario { padding: 6px 15px; background: #333; color: #fff; border: none; border-radius: 6px; cursor: pointer; }

        /* BOTÕES DE ESCOLHA EXPLICITAMENTE FIXOS */
        #opcoes { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 8px; 
            flex-shrink: 0; 
        }
        .botao-opcao {
            padding: 10px; background: #292929; color: #fff;
            border: 1px solid rgba(255,255,255,.2); border-radius: 8px;
            cursor: pointer; font-size: 0.85rem; transition: 0.2s; text-align: center;
        }
        .botao-opcao:hover:not(:disabled) { background: #3a3a3a; transform: translateY(-1px); }
        .botao-opcao:disabled { display: none; }

        #reiniciar { 
            background: #1a1a1a; flex-shrink: 0; padding: 7px; font-size: 0.8rem;
            color: var(--muted); border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
        }
        #reiniciar:hover { color: #fff; background: #252525; }

        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 30vh 1fr;
                grid-template-areas: "cabecalho" "midia" "painel";
                padding: 8px; gap: 8px; overflow-y: auto;
            }
            body { overflow: auto; }
            #opcoes { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div id="tela-inicio">
        <div class="painel-inicio">
            <img id="capa-jogo" src="assets/imagens/capa.jfif" alt="Capa do Projeto Eclipse" onerror="this.style.display='none'">
            <h1 id="titulo-abertura">PROJETO ECLIPSE</h1>
            <p id="subtitulo-abertura">Carregando sistema de segurança...</p>
            <button id="botao-iniciar" type="button" disabled>CARREGANDO...</button>
        </div>
    </div>

    <div id="modal-inventario">
        <div class="modal-conteudo">
            <h3>🎒 Seus Itens Coletados</h3>
            <ul id="lista-itens"><li>Vazio</li></ul>
            <button id="fechar-inventario" type="button">Fechar</button>
        </div>
    </div>

    <main class="container">
        <header class="cabecalho">
            <h1 id="titulo-jogo">Projeto Eclipse</h1>
            <p id="autor-jogo">Anna Beatriz</p>
        </header>

        <section class="midia">
            <div class="media-frame">
                <img id="imagem-cena" src="" alt="Cenário" style="display: none;">
                <video id="video-cena" controls playsinline style="display: none;"></video>
            </div>
            
            <audio id="audio-fundo" loop style="display: none;"></audio>
            <button id="btn-mutar" type="button">🔊 Áudio: Ligado</button>
        </section>

        <section class="painel-jogo">
            <h2 id="titulo-cena">Cena</h2>
            <div id="texto-cena">Carregando história...</div>
            
            <section id="status">
                <div class="status-box"><span class="status-label">Vida</span><div id="vida" class="status-value">❤️ ❤️ ❤️</div></div>
                <div class="status-box" id="inventario-box" title="Clique para ver os itens">
                    <span class="status-label">Inventário</span>
                    <div id="inventario" class="status-value">0 itens</div>
                </div>
                <div class="status-box"><span class="status-label">Pontos</span><div id="pontos" class="status-value">0</div></div>
            </section>
            
            <div id="opcoes">
                <button id="opcao1" class="botao-opcao" type="button"></button>
                <button id="opcao2" class="botao-opcao" type="button"></button>
                <button id="opcao3" class="botao-opcao" type="button"></button>
                <button id="opcao4" class="botao-opcao" type="button"></button>
            </div>
            <button id="reiniciar" type="button">↻ Reiniciar aventura</button>
        </section>
    </main>

    <script>
        const btnMutar = document.getElementById("btn-mutar");
        const audio = document.getElementById("audio-fundo");
        const modalInv = document.getElementById("modal-inventario");
        const boxInv = document.getElementById("inventario-box");
        const fecharInv = document.getElementById("fechar-inventario");

        btnMutar.addEventListener("click", () => {
            audio.muted = !audio.muted;
            btnMutar.innerText = audio.muted ? "🔇 Áudio: Mutado" : "🔊 Áudio: Ligado";
        });

        boxInv.addEventListener("click", () => { modalInv.style.display = "flex"; });
        fecharInv.addEventListener("click", () => { modalInv.style.display = "none"; });

        window.frameworkAudio = {
            async play(src, volume = 0.5, loop = true) {
                if (src && audio.getAttribute("src") !== src) {
                    audio.src = src; audio.load();
                }
                audio.volume = volume; audio.loop = loop;
                try { await audio.play(); } catch (e) {}
            },
            stop() { audio.pause(); audio.currentTime = 0; }
        };

        window.frameworkImage = {
            show(src) {
                const img = document.getElementById("imagem-cena");
                img.onload = () => img.style.display = "block";
                img.onerror = () => img.style.display = "none";
                img.src = src;
            },
            hide() { document.getElementById("imagem-cena").style.display = "none"; }
        };

        window.frameworkVideo = {
            async play(src, autoplay = false) {
                const vid = document.getElementById("video-cena");
                document.getElementById("imagem-cena").style.display = "none";
                vid.src = src; vid.style.display = "block"; vid.load();
                if (autoplay) { try { await vid.play(); } catch(e) {} }
            },
            stop() {
                const vid = document.getElementById("video-cena");
                vid.pause(); vid.style.display = "none"; vid.removeAttribute("src");
            }
        };

        document.getElementById("botao-iniciar").addEventListener("click", async function () {
            const trilhaInicial = audio.dataset.inicial || "";
            if (trilhaInicial) { await window.frameworkAudio.play(trilhaInicial, 0.5, true); }
            document.getElementById("tela-inicio").style.display = "none";
        });
    </script>
    <script type="py" src="./main.py"></script>
</body>
</html>
