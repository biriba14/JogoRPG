<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Projeto Eclipse</title>

    <!-- PyScript -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.2/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.2/core.js"></script>

    <style>
        * { box-sizing: border-box; font-family: Arial, sans-serif; }
        :root {
            --bg-1: #090909; --bg-2: #151515;
            --panel: #171717; --panel-2: #1d1d1d;
            --border: rgba(255,255,255,.10);
            --text: #f4f4f4; --muted: rgba(255,255,255,.68);
            --accent: #d5d5d5; --danger: #ffaaaa;
        }

        body {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            color: var(--text);
            background: linear-gradient(180deg, var(--bg-1), var(--bg-2));
            overflow: hidden;
        }

        /* TELA DE CARREGAMENTO */
        #tela-inicio {
            position: fixed; inset: 0; z-index: 99;
            display: flex; align-items: center; justify-content: center;
            background: #0a0a0a;
        }
        .painel-inicio {
            width: 90%; max-width: 600px;
            padding: 40px; text-align: center;
            background: #111; border: 1px solid var(--border);
            border-radius: 16px; box-shadow: 0 10px 40px rgba(0,0,0,.8);
        }
        #titulo-abertura { margin: 10px 0; font-size: 2.5rem; letter-spacing: 2px; }
        #subtitulo-abertura { color: var(--muted); margin-bottom: 30px; }
        #botao-iniciar {
            width: 100%; padding: 15px; font-size: 1.2rem; font-weight: bold;
            background: #fff; color: #000; border: none; border-radius: 8px;
            cursor: pointer; transition: 0.2s;
        }
        #botao-iniciar:hover:not(:disabled) { transform: scale(1.02); }
        #botao-iniciar:disabled { opacity: 0.5; cursor: wait; }

        /* JOGO PRINCIPAL */
        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            grid-template-rows: 60px 1fr;
            grid-template-areas: "cabecalho cabecalho" "midia painel";
            gap: 20px; max-width: 1400px; height: 100vh;
            margin: 0 auto; padding: 20px;
        }
        
        .cabecalho { grid-area: cabecalho; text-align: center; }
        #titulo-jogo { margin: 0; font-size: 2rem; }
        #autor-jogo { margin: 5px 0 0; color: var(--muted); font-size: 0.9rem; }

        /* MÍDIA (FOTO/VÍDEO) */
        .midia {
            grid-area: midia; display: flex; flex-direction: column;
            background: var(--panel-2); padding: 15px;
            border: 1px solid var(--border); border-radius: 16px;
        }
        .media-frame {
            flex: 1; display: flex; align-items: center; justify-content: center;
            background: #000; border-radius: 12px; overflow: hidden;
        }
        #imagem-cena, #video-cena {
            max-width: 100%; max-height: 100%; object-fit: contain;
        }
        
        /* BOTÃO DE ÁUDIO CUSTOMIZADO */
        #btn-mutar {
            width: 100%; margin-top: 15px; padding: 12px;
            background: #2a2a2a; color: #fff; border: 1px solid var(--border);
            border-radius: 8px; cursor: pointer; font-size: 1rem;
            transition: 0.2s; display: none; /* Escondido por padrão */
        }
        #btn-mutar:hover { background: #3a3a3a; }

        /* PAINEL NARRATIVO */
        .painel-jogo {
            grid-area: painel; display: flex; flex-direction: column; gap: 15px;
            background: var(--panel); padding: 20px;
            border: 1px solid var(--border); border-radius: 16px;
        }
        #titulo-cena { margin: 0; font-size: 1.8rem; color: var(--accent); }
        #texto-cena {
            flex: 1; overflow-y: auto; white-space: pre-line;
            padding: 15px; background: rgba(255,255,255,.05);
            border-left: 4px solid var(--muted); border-radius: 8px;
            font-size: 1.1rem; line-height: 1.6;
        }

        /* STATUS E INVENTÁRIO */
        #status { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .status-box {
            padding: 10px; background: rgba(255,255,255,.05);
            border: 1px solid var(--border); border-radius: 8px; text-align: center;
        }
        .status-label { display: block; font-size: 0.7rem; color: var(--muted); text-transform: uppercase; margin-bottom: 5px; }
        .status-value { font-size: 1.1rem; font-weight: bold; }
        #vida.danger { color: var(--danger); }

        /* BOTÕES DE ESCOLHA */
        #opcoes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .botao-opcao, #reiniciar {
            padding: 15px; background: #292929; color: #fff;
            border: 1px solid rgba(255,255,255,.2); border-radius: 8px;
            cursor: pointer; font-size: 1rem; transition: 0.2s;
        }
        .botao-opcao:hover:not(:disabled), #reiniciar:hover { background: #3a3a3a; transform: translateY(-2px); }
        .botao-opcao:disabled { opacity: 0.3; cursor: not-allowed; }
        #reiniciar { background: #1a1a1a; margin-top: 10px; }

        /* RESPONSIVO MODO CELULAR */
        @media (max-width: 900px) {
            .container {
                grid-template-columns: 1fr;
                grid-template-rows: auto 35vh 1fr;
                grid-template-areas: "cabecalho" "midia" "painel";
                padding: 10px; gap: 10px;
            }
            #opcoes { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <!-- TELA DE ABERTURA -->
    <div id="tela-inicio">
        <div class="painel-inicio">
            <h1 id="titulo-abertura">Carregando jogo...</h1>
            <p id="subtitulo-abertura">Aguarde o sistema iniciar.</p>
            <button id="botao-iniciar" type="button" disabled>CARREGANDO...</button>
        </div>
    </div>

    <!-- INTERFACE DO JOGO -->
    <main class="container">
        <header class="cabecalho">
            <h1 id="titulo-jogo">Projeto Eclipse</h1>
            <p id="autor-jogo">Anna Beatriz</p>
        </header>

        <section class="midia">
            <div class="media-frame">
                <!-- A imagem fica escondida por padrão -->
                <img id="imagem-cena" src="" alt="Cenário" style="display: none;">
                <!-- O vídeo fica escondido por padrão -->
                <video id="video-cena" controls playsinline style="display: none;"></video>
            </div>
            
            <!-- Áudio nativo totalmente oculto -->
            <audio id="audio-fundo" loop style="display: none;"></audio>
            <!-- Botão bonitão para mutar/desmutar (só aparece se tiver música) -->
            <button id="btn-mutar" type="button">🔊 Áudio: Ligado</button>
        </section>

        <section class="painel-jogo">
            <h2 id="titulo-cena">Cena</h2>
            <div id="texto-cena">Carregando...</div>
            
            <section id="status">
                <div class="status-box"><span class="status-label">Vida</span><div id="vida" class="status-value">❤️ ❤️ ❤️</div></div>
                <div class="status-box"><span class="status-label">Inventário</span><div id="inventario" class="status-value">Vazio</div></div>
                <div class="status-box"><span class="status-label">Pontos</span><div id="pontos" class="status-value">0</div></div>
            </section>
            
            <div id="opcoes">
                <button id="opcao1" class="botao-opcao" type="button" style="display: none;"></button>
                <button id="opcao2" class="botao-opcao" type="button" style="display: none;"></button>
                <button id="opcao3" class="botao-opcao" type="button" style="display: none;"></button>
                <button id="opcao4" class="botao-opcao" type="button" style="display: none;"></button>
            </div>
            <button id="reiniciar" type="button">↻ Reiniciar aventura</button>
        </section>
    </main>

    <!-- LÓGICA DE MULTIMÍDIA JAVASCRIPT -->
    <script>
        // Controle de Áudio Modernizado
        const btnMutar = document.getElementById("btn-mutar");
        const audio = document.getElementById("audio-fundo");

        btnMutar.addEventListener("click", () => {
            audio.muted = !audio.muted;
            btnMutar.innerText = audio.muted ? "🔇 Áudio: Mutado" : "🔊 Áudio: Ligado";
            btnMutar.style.background = audio.muted ? "#4a1a1a" : "#2a2a2a";
        });

        window.frameworkAudio = {
            async play(src, volume = 0.5, loop = true) {
                if (src && audio.getAttribute("src") !== src) {
                    audio.src = src; audio.load();
                }
                audio.volume = volume; audio.loop = loop;
                try {
                    await audio.play();
                    btnMutar.style.display = "block"; // Só mostra o botão se tocou a música
                } catch (erro) { console.log("Aguardando clique do usuário.", erro); }
            },
            stop() {
                audio.pause(); audio.currentTime = 0;
                btnMutar.style.display = "none"; // Esconde o botão se a cena for silenciosa
            }
        };

        // Controle de Imagem
        window.frameworkImage = {
            show(src) {
                const img = document.getElementById("imagem-cena");
                img.onload = () => img.style.display = "block";
                img.onerror = () => img.style.display = "none";
                img.src = src;
            },
            hide() {
                document.getElementById("imagem-cena").style.display = "none";
            }
        };

        // Controle de Vídeo (Oculta se não houver vídeo)
        window.frameworkVideo = {
            async play(src, autoplay = false) {
                const vid = document.getElementById("video-cena");
                document.getElementById("imagem-cena").style.display = "none";
                vid.src = src; vid.style.display = "block"; vid.load();
                if (autoplay) { try { await vid.play(); } catch(e) {} }
            },
            stop() {
                const vid = document.getElementById("video-cena");
                vid.pause(); vid.style.display = "none"; vid.removeAttribute("src");
            }
        };

        // Início do Jogo
        document.getElementById("botao-iniciar").addEventListener("click", async function () {
            const trilhaInicial = audio.dataset.inicial || "";
            if (trilhaInicial) { await window.frameworkAudio.play(trilhaInicial, 0.5, true); }
            document.getElementById("tela-inicio").style.display = "none";
        });
    </script>

    <!-- CONEXÃO COM O PYTHON -->
    <script type="py" src="./main.py"></script>
</body>
</html>
